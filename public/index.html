<!DOCTYPE html>
<html>
<head>
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="dashboard">
    <h1>Weather Dashboard</h1>
    <p class="subtitle">Simple dummy weather app deployed on Render</p>

    <section class="card">
      <h2 id="city">Loading...</h2>
      <p id="temperature" class="temperature"></p>
      <p id="condition"></p>

      <div class="details">
        <p><strong>Humidity:</strong> <span id="humidity"></span></p>
        <p><strong>Wind:</strong> <span id="wind"></span></p>
        <p><strong>Updated:</strong> <span id="updatedAt"></span></p>
      </div>

      <!-- NEW: Save button -->
      <button id="saveBtn">Save Weather Log</button>

      <!-- NEW: Weather history table -->
      <h3>Weather History</h3>
      <table>
        <thead>
          <tr>
            <th>City</th>
            <th>Temp</th>
            <th>Condition</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="logsTable"></tbody>
      </table>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
